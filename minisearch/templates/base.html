{% load static %}
<html lang="en" class="h-100">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Minisearch - {% block title %}{% endblock %}</title>

  <link href="{% static 'css/bootstrap.min.css' %}" rel="stylesheet">
  <link href="{% static 'css/main.css' %}" rel="stylesheet">

  <!-- Custom styles for this template -->
  <link href="{% static 'css/cover.css' %}" rel="stylesheet">
</head>

<body class="d-flex h-100 text-center text-bg-dark">

  <div class="cover-container d-flex w-100 h-100 p-3 mx-auto flex-column">
    <header class="mb-auto">
      <div>
        <h3 class="float-md-start mb-0">Minisearch</h3>
      </div>
    </header>

    <main class="px-3">
      <h1>Search</h1>
      <p class="lead">Find all similar values of a selected key and the percentage of these similarities
        (text-matching).</p>
      {% block main %}

      {% endblock %}
    </main>

    <footer class="mt-auto text-white-50">
      <p>Paymob challenge</p>
    </footer>
  </div>
  <script src="{% static 'js/main.js' %}"></script>
</body>

</html>
